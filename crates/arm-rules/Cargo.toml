[package]
name = "arm-rules"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Pure Ars Magica 5th Edition rules engine: types, parsing, validation, evaluation"
repository.workspace = true
homepage.workspace = true
# The integration tests compile into the explicit `[[test]]` target below, not
# one binary per `tests/*.rs` file; `tests/test_targets.rs` fails when a test
# file is declared in no target root.
autotests = false

[[test]]
name = "all"
path = "tests/all.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
pretty_assertions = "1"
proptest = { workspace = true }
regex = "1"

[package]
name = "arm-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Tauri desktop shell for the Ars Magica character generator"
repository.workspace = true
homepage.workspace = true

# Library holds the testable command logic; the binary is a thin launcher.
[lib]
name = "arm_app"
path = "src/lib.rs"

[[bin]]
name = "arm-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
arm-rules = { path = "../arm-rules" }
serde = { workspace = true }
serde_json = { workspace = true }
# Caret ranges, not exact pins: `Cargo.lock` is committed, so the build is
# already reproducible, and over-pinning here would add a second place to bump
# on every upgrade for no gain. `Cargo.lock` currently resolves tauri 2.11.3.
#
# Keep that resolved version and the `tauri-cli` pin in `.github/workflows/`
# (`=2.11.3` in both ci.yml and release.yml) on the same minor. The CLI
# generates and validates the config this library then consumes, so letting the
# two drift across a minor is the failure this note exists to prevent — if you
# `cargo update` tauri past 2.11, update the workflow pins in the same change.
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3"

# Off by default, so a plain `cargo build --release` — the exact command that
# produces the binary users install — never compiles in the ARM_E2E_FILE /
# ARM_E2E_EXPORT_FILE env-var overrides (K5/VA5, security review wave 1).
# `ui/e2e/wdio.conf.js` is the only caller that passes `--features e2e-testing`
# to `cargo tauri build` — the standard suite needs the seam to drive save/
# load/export without native dialogs. The portable-layout smoke check
# (`ui/e2e/wdio.portable.conf.js` / `stage-portable.js`) never saves or loads,
# so it deliberately builds without this feature, matching the exact artifact
# `build-linux.sh`/`build-win.sh` ship.
[features]
e2e-testing = []

[package]
name = "arm-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Tauri desktop shell for the Ars Magica character generator"
repository.workspace = true
homepage.workspace = true
# The integration tests compile into the explicit `[[test]]` targets below, not
# one binary per `tests/*.rs` file; arm-rules' `tests/test_targets.rs` fails
# when a test file is declared in no target root. `commands` is its own target
# because it mutates process environment variables.
autotests = false

[[test]]
name = "app"
path = "tests/app.rs"

[[test]]
name = "commands"
path = "tests/commands.rs"

# Library holds the testable command logic; the binary is a thin launcher.
[lib]
name = "arm_app"
path = "src/lib.rs"

[[bin]]
name = "arm-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
arm-rules = { path = "../arm-rules" }
serde = { workspace = true }
serde_json = { workspace = true }
# The update check (M6.6) compares the running version with the latest GitHub
# release tag as semver; `semver` also rejects overlong and overflowing numbers.
semver = "1"
# The update check's one HTTPS GET, made from Rust and never from the webview
# (decision 1, D90). Blocking, so it needs no async runtime of its own; it runs
# inside `spawn_blocking`. Default features: rustls + gzip.
ureq = "3"
# Opens the fixed release-page URL in the user's browser. Chosen over
# tauri-plugin-opener: no plugin, no capability, no unused zbus features.
open = "5"
# Caret ranges, not exact pins: `Cargo.lock` is committed, so the build is
# already reproducible, and over-pinning here would add a second place to bump
# on every upgrade for no gain. `Cargo.lock` currently resolves tauri 2.11.3.
#
# Keep that resolved version and the `tauri-cli` pin in `.github/workflows/`
# (`=2.11.3` in both ci.yml and release.yml) on the same minor. The CLI
# generates and validates the config this library then consumes, so letting the
# two drift across a minor is the failure this note exists to prevent — if you
# `cargo update` tauri past 2.11, update the workflow pins in the same change.
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
# A3 (F5): the macOS discard-confirmation dialog (`discard_dialog.rs`) calls rfd
# directly instead of through tauri-plugin-dialog, because the plugin always
# maps a plain `rfd::MessageDialogResult::Cancel` (Esc, the sheet closed) to
# its SECOND button label — which would be Discard here
# (`tauri-plugin-dialog-2.7.1/src/desktop.rs:236-239`). Same version
# tauri-plugin-dialog already resolves (`Cargo.lock`), so this adds no second
# resolution. The pure outcome-mapping function also needs this to compile on
# every platform, not only macOS — see `discard_dialog.rs`'s module doc.
# `default-features = false`: tauri-plugin-dialog's own `gtk3` feature (its
# default) already enables rfd's `gtk3`, and rfd's build script refuses to
# enable both `gtk3` and the default `xdg-portal` at once — this crate needs
# no rfd feature of its own, only the always-compiled `MessageDialogResult`
# type and, on macOS, `MessageDialog` itself.
rfd = { version = "0.16", default-features = false }

# A3 (F5): the Linux discard-confirmation dialog (`discard_dialog.rs`) is a
# direct `gtk::MessageDialog` instead of rfd's GTK3 backend, which never calls
# `set_default_response` at all
# (`rfd-0.16.0/src/backend/gtk3/message_dialog.rs`) — so Enter has no effect
# and GTK's own fallback (tab order), not this app, decides which button
# activates. Same version already resolved transitively (tauri, muda and rfd's
# own gtk3 backend all pull gtk 0.18 — `Cargo.lock`).
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

# A3 (F5): the Windows discard-confirmation dialog (`discard_dialog.rs`) calls
# `TaskDialogIndirect` directly, because rfd's own Windows backend
# (`rfd-0.16.0/src/backend/win_cid/message_dialog.rs:156`) hardcodes
# `nDefaultButton: 0`, which matches none of its custom button ids, so
# `TaskDialogIndirect`'s own documented fallback makes the FIRST button —
# Discard — the Enter default. `0.61` matches the version most of this
# workspace's other Windows-only dependencies already resolve to
# (`Cargo.lock`); minimal features — just the two modules `discard_dialog.rs`
# needs (`Win32_Foundation`'s types, e.g. `HWND`, are unconditionally part of
# windows-sys and need no feature flag of their own).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", default-features = false, features = [
    "Win32_UI_Controls",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
# Tests only — never linked into the binary. `tests/menu.rs` parses the menu's
# accelerator strings with the very parser tauri uses, because
# `MenuItem::with_id` drops one it cannot parse without saying so
# (tauri-2.11.3/src/menu/normal.rs:69) and a typo would otherwise ship as a
# shortcut that silently does not exist. tauri 2.11.3 resolves muda 0.19.x, and
# cargo unifies the two on that; keep this on the same minor when tauri moves,
# or the test would be validating a different parser than the one that runs.
#
# `default-features = false` IS LOAD-BEARING, and was learned the hard way:
# muda's defaults are `libxdo` + `gtk`, cargo unifies features across the
# graph, and tauri gates `muda/libxdo` behind its own `linux-libxdo` feature
# which this crate deliberately does not enable (C3a). Taking muda with its
# defaults therefore switched `libxdo` on for the real build too — it failed to
# link (`unable to find library -lxdo`) and, had the library been present,
# would have quietly changed how the shipped menu's predefined items behave.
# Take exactly what tauri takes: nothing but what it already enables.
muda = { version = "0.19", default-features = false }
pretty_assertions = "1"
# `tests/update_check.rs`: arbitrary bytes and tags must never panic the parser.
proptest = { workspace = true }
# Tauri's `MockRuntime` (`tauri::test`), for `tests/a3_mock_app_commands.rs`:
# a `State<'_, AppState>` exists only inside a running app's managed state, so
# the `#[tauri::command]` shims and the generic menu glue are reachable from a
# test only through a mock app. The feature adds no dependency, and as a
# dev-dependency it is never compiled into the shipped binary.
tauri = { version = "2", features = ["test"] }
tempfile = "3"

# Off by default, so a plain `cargo build --release` — the exact command that
# produces the binary users install — never compiles in the ARM_E2E_FILE /
# ARM_E2E_EXPORT_FILE env-var overrides (K5/VA5, security review wave 1).
# `ui/e2e/wdio.conf.js` is the only caller that passes `--features e2e-testing`
# to `cargo tauri build` — the standard suite needs the seam to drive save/
# load/export without native dialogs. The portable-layout smoke check
# (`ui/e2e/wdio.portable.conf.js` / `stage-portable.js`) never saves or loads,
# so it deliberately builds without this feature, matching the exact artifact
# `build-linux.sh`/`build-win.sh` ship.
[features]
e2e-testing = []

name: CI

# Runs CLAUDE.md's Required Gate on every push and pull request — the backstop
# `release.yml` does not provide (it only builds and bundles for a tagged
# release; it never runs the tests, clippy, fmt, or frontend checks). Kept as a
# separate workflow rather than folding into `release.yml`, which stays
# scoped to cutting/bundling a release build.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  gate:
    permissions:
      contents: read # read-only: this workflow only checks out and tests, never publishes
    runs-on: ubuntu-22.04 # matches release.yml's Linux leg; a single Linux runner is sufficient for the gate
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # WebKitGTK is the Linux system WebView the app renders in; the `arm-app`
      # crate's build script links against it, so every cargo command below
      # (test/clippy/build) needs it, not only the final `cargo tauri build`.
      # Mirrors release.yml's Linux dependency list exactly.
      - name: Install Linux WebView + bundling deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2 \
            file \
            build-essential \
            libssl-dev \
            libxdo-dev

      # Same pin as release.yml (K6: this action has no versioned release tags,
      # only moving channel branches, so a SHA pin necessarily freezes it).
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable (pinned)

      - name: Cache Rust build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: ui

      # --- CLAUDE.md's Required Gate, in order -------------------------------

      - name: cargo test --workspace
        run: cargo test --workspace

      # --all-targets lints the test and integration-test crates too, not only
      # the libraries — see CLAUDE.md's Required Gate for why that matters.
      - name: cargo clippy --workspace --all-targets -- -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: npm run test:unit
        run: npm run test:unit
        working-directory: ui

      - name: npm run lint
        run: npm run lint
        working-directory: ui

      - name: npm run format:check
        run: npm run format:check
        working-directory: ui

      # svelte-check type-checks the frontend; vitest (test:unit) does not.
      - name: npm run check
        run: npm run check
        working-directory: ui

      # The same CLI version release.yml installs, both pinned EXACTLY (Klaus K6 /
      # Gerda G29: a drifting tilde range installs whatever patch is newest at
      # run time, which release.yml used to do until V16 matched it here).
      # `=2.11.3` is the version this pin was verified against locally
      # (`cargo tauri --version`).
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '=2.11.3' --locked

      # FULL RELEASE APP COMPILE — the only step that exercises the shipped
      # production code path: runs the frontend build (svelte-check + vite) via
      # `beforeBuildCommand` AND compiles the release binary. Neither `cargo
      # test`/`clippy` above nor `npm run test:unit` builds the production app,
      # so type errors and production-only breakage slip past every other gate.
      - name: cargo tauri build --no-bundle
        run: cargo tauri build --no-bundle
